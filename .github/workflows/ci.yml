name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node's CompressionStream gained 'deflate-raw' in 20.12.0 (backport of
        # 21.2.0 #50097); 18 lacks it (and is EOL). See package.json engines.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
